spring:
  application:
    name: GameTrade
  
  # ========== 数据库配置 ==========
  datasource:
    url: jdbc:sqlserver://localhost\\SQLEXPRESS:1433;databaseName=GameTrade;encrypt=true;trustServerCertificate=true;
    username: sa
    password: 123456
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  
  # ========== JPA/Hibernate 配置 ==========
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect
        jdbc:
          batch_size: 20
          fetch_size: 50

# ========== 其他配置 ==========
server:
  port: 8080
  tomcat:
    uri-encoding: UTF-8
